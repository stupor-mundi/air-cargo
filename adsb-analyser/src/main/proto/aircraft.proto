syntax = "proto3";
package io.aircargo.analyser;
option java_package = "io.aircargo.analyser.proto";
option java_outer_classname = "AircraftProto";
option java_multiple_files = true;

enum FlightPhase {
  FLIGHT_PHASE_UNKNOWN = 0;
  AIRBORNE             = 1;
  ON_APPROACH          = 2;
  ON_GROUND            = 3;
  LOST_TRACKING        = 4;
}

enum PositionSource {
  POSITION_SOURCE_UNKNOWN = 0;
  ADS_B                   = 1;
  MLAT                    = 2;
  ASTERIX                 = 3;
  FLARM                   = 4;
}

// Enriched per-aircraft position update.
// Written to Kafka topic adsb.tracks, keyed by icao24.
// flight_id is system-generated by Flink on takeoff detection: icao24 + takeoff_ms.
message PositionUpdate {
  string         icao24          = 1;
  string         flight_id       = 2;  // system-generated: icao24 + takeoff_ms
  int64          timestamp_ms    = 3;  // from OpenSky snapshot time field
  double         latitude        = 4;
  double         longitude       = 5;
  double         altitude_m      = 6;  // is baro — used for flight phase detection
  double         velocity_ms     = 7;
  double         heading_deg     = 8;
  double         vertical_rate_ms = 9;
  PositionSource position_source = 10;
  FlightPhase    flight_phase    = 11;
  bool           interpolated    = 12; // true if inferred across coverage gap
  double         anomaly_score   = 13; // 0.0-1.0, running score from Flink state
  double         geo_altitude_m  = 14; // GPS-derived, nullable — preferred for spatial ops
}

// Current state per aircraft.
// Written to Kafka topic adsb.plane_state (log compacted), keyed by icao24.
// Latest value per key = current known state.
// Also persisted to PostgreSQL JSONB for history.
// aircraft_type and operator are enriched from registry lookup; may be absent
// if the ICAO24 is not yet in the local database.
message PlaneState {
  string      icao24             = 1;
  string      aircraft_type      = 2;  // from local registry, nullable
  string      operator           = 3;  // from local registry, nullable
  FlightPhase flight_phase       = 4;
  int64       timestamp_ms       = 5;  // of this state update
  double      latitude           = 6;  // latest known, nullable
  double      longitude          = 7;  // latest known, nullable
  double      altitude_m         = 8;  // latest known, nullable
  double      velocity_ms        = 9;  // latest known, nullable
  double      heading_deg        = 10; // latest known, nullable
  string      current_flight_id  = 11; // absent when on ground
  string      departed_from      = 12; // airport ICAO, absent if unknown
  int64       departed_at_ms     = 13; // absent if unknown
  double      anomaly_score      = 14; // 0.0-1.0
}
